databases:
  - name: pollution-db
    region: frankfurt
    databaseName: pollution
    user: pollution_user

services:
  - type: web
    name: api-pollution
    runtime: node
    region: frankfurt
    plan: free
    rootDir: projet_blumletiec_mayline/backend
    buildCommand: npm install && node init-db.js
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pollution-db
          property: connectionString
      - key: NODE_ENV
        value: production
