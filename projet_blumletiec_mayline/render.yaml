
databases:
  - name: pollution-db
    region: frankfurt
    databaseName: pollution
    user: pollution_user

services:
  # Backend Express
  - type: web
    name: api-pollution
    runtime: node
    region: frankfurt
    plan: free
    rootDir: projet_blumletiec_mayline/backend
    buildCommand: npm install && node init-db.js
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pollution-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # Frontend Angular avec SSR
  - type: web
    name: pollution-front-tp05
    runtime: node
    region: frankfurt
    plan: free
    rootDir: projet_blumletiec_mayline
    buildCommand: npm install && npm run build
    startCommand: npm run serve:ssr:projet1
    envVars:
      - key: NODE_ENV
        value: production
