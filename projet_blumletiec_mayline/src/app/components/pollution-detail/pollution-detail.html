
<section class="detail-page">
  <a class="back-link" routerLink="/pollutions">
    ← Retour à la liste
  </a>

  <!-- Affichage du chargement -->
  @if (chargement) {
    <p class="info-message">
      Chargement de la déclaration...
    </p>
  }

  <!-- Affichage des erreurs -->
  @if (erreurMessage) {
    <p class="error-message" role="alert">
      {{ erreurMessage }}
    </p>
  }

  <!-- Affichage des détails de la pollution -->
  @if (pollution; as declaration) {
    <header class="page-header">
      <div>
        <h1>Détail de la déclaration</h1>
        <p>Consultez les informations de cette pollution.</p>
      </div>

      <a
        class="btn-primary"
        [routerLink]="['/pollutions', declaration.id, 'modifier']"
      >
        Modifier la déclaration
      </a>
    </header>

    <app-pollution-summary
      [pollution]="declaration"
    >
    </app-pollution-summary>
  }
</section>
