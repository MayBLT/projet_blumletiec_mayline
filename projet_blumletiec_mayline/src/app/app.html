
<div class="application">

  <header class="header">
    <h1>Gestion des pollutions</h1>
    <p>Bienvenue sur votre espace de gestion.</p>
  </header>

  <nav class="onglets">

    @if (estAuthentifie()) {
  <button
    routerLink="/pollutions"
    routerLinkActive="actif"
    [routerLinkActiveOptions]="{ exact: true }">
    Pollutions
  </button>
}

    @if (!estAuthentifie()) {
      <button
        routerLink="/inscription"
        routerLinkActive="actif">
        Inscription
      </button>

      <button
        routerLink="/connexion"
        routerLinkActive="actif">
        Connexion
      </button>
    }

    @if (estAuthentifie() && utilisateur(); as user) {
      <span class="utilisateur-connecte">
        Connecté(e) : <strong>{{ user.nom }}</strong>
      </span>

      <button
        type="button"
        class="bouton-deconnexion"
        (click)="deconnecter()">
        Déconnexion
      </button>
    }

  </nav>

  <main class="contenu">
    <router-outlet></router-outlet>
  </main>

</div>
