<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <!-- Permet une bonne adaptation sur téléphone et tablette -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription</title>

    <!-- Chargement de la feuille de style -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Conteneur principal de la page -->
    <main class="container">

        <h1>Inscription</h1>

        <!-- Zone où les erreurs seront affichées par JavaScript -->
        <div id="message-erreur" class="alert-error hidden"></div>


        <!-- Formulaire d'inscription -->
        <form id="formulaire-inscription">

            <!-- Login -->
            <div class="form-group">
                <label for="login">Login :</label>
                <input
                    type="text"
                    id="login"
                    name="login"
                    required
                    minlength="3"
                    maxlength="20"
                >
            </div>


            <!-- Mot de passe -->
            <div class="form-group">
                <label for="motdepasse">Mot de passe :</label>
                <input
                    type="password"
                    id="motdepasse"
                    name="motdepasse"
                    required
                    minlength="8"
                >
            </div>


            <!-- Confirmation du mot de passe -->
            <div class="form-group">
                <label for="confirmation">Confirmation du mot de passe :</label>
                <input
                    type="password"
                    id="confirmation"
                    name="confirmation"
                    required
                >
            </div>


            <!-- Nom -->
            <div class="form-group">
                <label for="nom">Nom :</label>
                <input
                    type="text"
                    id="nom"
                    name="nom"
                    required
                >
            </div>


            <!-- Prénom -->
            <div class="form-group">
                <label for="prenom">Prénom :</label>
                <input
                    type="text"
                    id="prenom"
                    name="prenom"
                    required
                >
            </div>


            <!-- Adresse séparée en plusieurs parties -->
            <fieldset>

                <legend>Adresse</legend>

                <div class="form-group">
                    <label for="numero">Numéro :</label>
                    <input
                        type="text"
                        id="numero"
                        name="numero"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="rue">Rue :</label>
                    <input
                        type="text"
                        id="rue"
                        name="rue"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="codepostal">Code postal :</label>
                    <input
                        type="text"
                        id="codepostal"
                        name="codepostal"
                        required
                        maxlength="5"
                    >
                </div>

                <div class="form-group">
                    <label for="ville">Ville :</label>
                    <input
                        type="text"
                        id="ville"
                        name="ville"
                        required
                    >
                </div>

            </fieldset>


            <!-- Email -->
            <div class="form-group">
                <label for="email">Email :</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>


            <!-- Téléphone -->
            <div class="form-group">
                <label for="telephone">Téléphone :</label>
                <input
                    type="tel"
                    id="telephone"
                    name="telephone"
                    required
                >
            </div>


            <!-- Date de naissance -->
            <div class="form-group">
                <label for="naissance">Date de naissance :</label>
                <input
                    type="date"
                    id="naissance"
                    name="naissance"
                    required
                >
            </div>


            <!-- Bouton d'envoi du formulaire -->
            <button type="submit">S'inscrire</button>

        </form>


        <!-- Récapitulatif affiché après validation -->
        <section id="recapitulatif" class="hidden">

            <h2>Récapitulatif de votre inscription</h2>

            <div class="recap-list">

                <div class="recap-item">
                    <span class="recap-label">Login :</span>
                    <span id="recap-login" class="recap-value"></span>
                </div>

                <div class="recap-item">
                    <span class="recap-label">Nom :</span>
                    <span id="recap-nom" class="recap-value"></span>
                </div>

                <div class="recap-item">
                    <span class="recap-label">Prénom :</span>
                    <span id="recap-prenom" class="recap-value"></span>
                </div>

                <div class="recap-item">
                    <span class="recap-label">Adresse :</span>
                    <span id="recap-adresse" class="recap-value"></span>
                </div>

                <div class="recap-item">
                    <span class="recap-label">Email :</span>
                    <span id="recap-email" class="recap-value"></span>
                </div>

                <div class="recap-item">
                    <span class="recap-label">Téléphone :</span>
                    <span id="recap-telephone" class="recap-value"></span>
                </div>

                <div class="recap-item">
                    <span class="recap-label">Date de naissance :</span>
                    <span id="recap-naissance" class="recap-value"></span>
                </div>

            </div>

            <!-- Message affiché lorsque l'inscription est validée -->
            <div class="message-succes">
                Votre inscription a été effectuée avec succès.
            </div>

        </section>

    </main>

    <!-- Chargement du JavaScript après le contenu HTML -->
    <script src="script.js"></script>

</body>
</html>
